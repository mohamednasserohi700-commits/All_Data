<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — نظام ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <div class="logo-icon">🏢</div>
        <h1>نظام ERP</h1>
        <p>نظام إدارة الموارد المؤسسية</p>
      </div>

      {% if error %}
      <div class="alert alert-error">⚠️ {{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top: 8px;">
          🔑 تسجيل الدخول
        </button>
      </form>

      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.07); text-align: center;">
        <p style="font-size: 0.75rem; color: var(--text-muted);">
           <strong style="color: var(--text-secondary);"></strong> |
        : <strong style="color: var(--text-secondary);"></strong>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
